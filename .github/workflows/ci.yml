name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kept so the Skia job can also be re-run by hand after an SDK/API change.
  workflow_dispatch:

# `gh` (used by the Windows job to pull the prebuilt Skia plugin) needs
# `actions: read` to list runs and download artifacts, and the Skia job
# uploads artifacts which needs `actions: write`. Spell both out so the
# default token scope is not narrower than required.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # A. 跨平台后端层（进行中）
  # 本地编不了的平台（Linux / macOS）统一交给 GitHub Actions 编译。
  # airui-core 是平台无关核心，三平台均通过 CMake + 生成器构建。
  # ---------------------------------------------------------------
  core-unix:
    name: airui-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake + Unix Makefiles)
        run: cmake -S . -B build-core -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      # On non-Windows the Win32 app/gallery targets are not buildable;
      # airui-core + the platform-free tests are the complete buildable set.
      - name: Build ALL platform-free targets
        run: |
          cmake --build build-core --config Release --target airui-core
          cmake --build build-core --config Release --target test_shell_hal
          cmake --build build-core --config Release --target test_paint_recorder
          cmake --build build-core --config Release --target test_paint_backend
          cmake --build build-core --config Release --target test_skia_types

      - name: Run platform-free HAL tests
        run: |
          ./build-core/test_shell_hal
          ./build-core/test_paint_recorder
          ./build-core/test_paint_backend
          ./build-core/test_skia_types

      - name: Skia backend API contract gate (no SDK required)
        run: bash scripts/check-skia-syntax.sh

      - name: Core smoke test (compile + link + run core tests)
        run: bash scripts/check-core-linux-smoke.sh

      # Publish every build output of this platform, not just the tests.
      - name: Stage core artifacts
        run: |
          mkdir -p artifact-staging
          cp build-core/libairui-core.a artifact-staging/
          for t in test_shell_hal test_paint_recorder test_paint_backend test_skia_types; do
            cp "build-core/$t" artifact-staging/
          done
          printf 'airui-core + platform-free tests, built on %s\n' "${{ matrix.os }}" \
            > artifact-staging/README.txt
          ls -lh artifact-staging/

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p-system-core-${{ matrix.os }}
          path: artifact-staging/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------
  # Windows compile gate.
  #
  # IMPORTANT: do NOT put this job on `windows-latest`. GitHub migrated
  # windows-latest / windows-2025 to the VS2026 image in June 2026; that
  # image has NO VS2022 installed and ships CMake <= 4.1.2, while the
  # "Visual Studio 18 2026" generator needs CMake >= 4.2. Pinning the
  # VS2022 generator on that image fails at configure with:
  #   "Generator ... could not find any instance of Visual Studio."
  # `windows-2022` is the image that still ships VS2022, and matches the
  # second local toolchain (VS2022 Professional). The official local
  # build remains CMake + VS2017 via build.bat (see README).
  # ---------------------------------------------------------------
  windows:
    name: airui-core (windows / VS2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Verify VS2022 toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $lines = & $vswhere -all -products * -property catalog_productLineVersion
          Write-Host "Installed VS product lines: $($lines -join ', ')"
          if (-not ($lines | Where-Object { $_ -eq '2022' })) {
            throw "Visual Studio 2022 is missing; pin this job to a VS2022 image."
          }

      - name: Configure (CMake + VS2022)
        run: cmake -S . -B build-core -G "Visual Studio 17 2022" -A x64

      # Best-effort pre-fetch of the prebuilt x64 Skia plugin so the
      # POST_BUILD deploy step finds it locally (no `gh` call inside the
      # CMake build). gh in Actions needs GH_TOKEN explicitly; it falls
      # back to GITHUB_TOKEN's value. If anything fails we simply let the
      # app fall back to GDI -- the build must not break.
      # Best-effort pre-fetch of the prebuilt x64 Skia plugin so the
      # POST_BUILD deploy step finds it locally (no `gh` call inside the
      # CMake build). In this Actions setup GITHUB_TOKEN is NOT auto-
      # exported, so we pass it explicitly via GH_TOKEN (gh's own hint:
      # "GH_TOKEN: ${{ github.token }}"). If anything fails we simply let
      # the app fall back to GDI -- the build must not break.
      - name: Download Skia plugin artifact (best-effort)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = (gh run list --workflow ci.yml --status success --limit 1 `
                      --json databaseId --jq ".[0].databaseId") 2>$null
          if (-not $runId -or $runId -notmatch '^\d+$') {
            Write-Host "deploy-skia: no successful run found; skipping (GDI fallback)"
            exit 0
          }
          Write-Host "deploy-skia: latest successful run = $runId"
          # gh run download -D <dir> extracts the artifact CONTENTS directly
          # into <dir> (no artifact-name subfolder), so point it at the exact
          # directory the POST_BUILD deploy script scans.
          New-Item -ItemType Directory -Force -Path "build-core/ci-all/airui-skia-windows-x64" | Out-Null
          gh run download $runId --name airui-skia-windows-x64 -D "build-core/ci-all/airui-skia-windows-x64"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "deploy-skia: download failed; app will fall back to GDI"
            exit 0
          }
          Write-Host "deploy-skia: plugin staged under build-core/ci-all/airui-skia-windows-x64"

      - name: Build ALL targets (app, gallery, tests, libs)
        run: cmake --build build-core --config Release

      - name: Run full ctest suite
        run: ctest --test-dir build-core -C Release --output-on-failure

      # Publish the complete default (GDI) x64 build: every exe, dll, lib.
      - name: Stage full x64 (GDI) artifacts
        shell: pwsh
        run: |
          $dst = "artifact-staging"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem "build-core\Release" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll", ".lib") } |
            ForEach-Object { Copy-Item $_.FullName $dst -Force }
          "Complete default build (VS2022 x64, GDI, no Skia SDK).`r`nAll exe/dll/lib from build-core/Release." |
            Set-Content -Path "$dst\README.txt" -Encoding ascii
          Get-ChildItem $dst | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload full x64 (GDI) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p-system-windows-x64-gdi
          path: artifact-staging/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------
  # A2. Second architecture: the official local build is x86, so also
  # publish a complete Win32 build for users who need 32-bit binaries.
  # ---------------------------------------------------------------
  windows-x86:
    name: full build (windows / VS2022 Win32)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake + VS2022 Win32)
        run: cmake -S . -B build-x86 -G "Visual Studio 17 2022" -A Win32

      - name: Build ALL targets
        run: cmake --build build-x86 --config Release

      - name: Run full ctest suite
        run: ctest --test-dir build-x86 -C Release --output-on-failure

      - name: Stage full x86 (GDI) artifacts
        shell: pwsh
        run: |
          $dst = "artifact-staging"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem "build-x86\Release" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll", ".lib") } |
            ForEach-Object { Copy-Item $_.FullName $dst -Force }
          "Complete default build (VS2022 Win32 / x86, GDI, no Skia SDK).`r`nAll exe/dll/lib from build-x86/Release." |
            Set-Content -Path "$dst\README.txt" -Encoding ascii
          Get-ChildItem $dst | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload full x86 (GDI) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p-system-windows-x86-gdi
          path: artifact-staging/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------
  # B. Real Skia SDK verification — automatic on every push / PR.
  #
  # vcpkg's skia port builds from source (vcpkg_from_github + GN + Ninja),
  # it does NOT download a prebuilt library. So we cache the vcpkg binary
  # archives and the installed tree: the first run pays the build cost,
  # later runs restore. Third-party SDK builds can be flaky, so this job
  # stays non-blocking; core CI above is the required gate.
  #
  # Same VS2022 image pin as the windows job above (windows-latest now
  # ships VS2026 only). CI may differ from the local CMake+VS2017 build
  # by agreement.
  # ---------------------------------------------------------------
  skia-windows:
    name: Skia backend (windows / VS2022 + vcpkg)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 120
    # Do not let workflow-level cancel-in-progress kill a long Skia build
    # before it can save its cache.
    concurrency:
      group: skia-${{ github.ref }}
      cancel-in-progress: false
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve vcpkg root
        id: vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) { throw "VCPKG_INSTALLATION_ROOT is not set on this runner" }
          # Expose a forward-slash absolute path for actions/cache globs.
          "root=$($root.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path ".vcpkg-archives" | Out-Null

      # `env.VCPKG_ROOT` is NOT visible in a `with:` expression (env context
      # only holds workflow-defined values), so use the step output instead.
      - name: Restore vcpkg Skia artifacts
        id: skia-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-archives
            ${{ steps.vcpkg.outputs.root }}/installed
            ${{ steps.vcpkg.outputs.root }}/downloads
          key: vcpkg-skia-windows-2022-v2
          restore-keys: |
            vcpkg-skia-windows-2022-

      - name: Install Skia via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install skia:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Save right after install. actions/cache's implicit post-step only
      # saves on a fully successful job, so a later compile failure used to
      # throw away a ~35 min Skia source build on every single run.
      - name: Save vcpkg Skia artifacts
        if: steps.skia-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-archives
            ${{ steps.vcpkg.outputs.root }}/installed
            ${{ steps.vcpkg.outputs.root }}/downloads
          key: vcpkg-skia-windows-2022-v2

      - name: Verify VS2022 toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $lines = & $vswhere -all -products * -property catalog_productLineVersion
          Write-Host "Installed VS product lines: $($lines -join ', ')"
          if (-not ($lines | Where-Object { $_ -eq '2022' })) {
            throw "Visual Studio 2022 is missing; pin this job to a VS2022 image."
          }

      # Skia's API drifts between releases; keep the real signatures in
      # the job log so a future compile failure is a one-look diagnosis.
      - name: Record real Skia API signatures (diagnostics)
        continue-on-error: true
        shell: pwsh
        run: |
          $inc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include\skia\include"
          foreach ($f in @("core\SkTypeface.h", "core\SkFontMgr.h",
                           "core\SkPathBuilder.h", "core\SkSpan.h",
                           "effects\SkDashPathEffect.h")) {
            $p = Join-Path $inc $f
            Write-Host "--- $f ---"
            if (-not (Test-Path $p)) { Write-Host "(not present)"; continue }
            Get-Content $p |
              Select-String -Pattern 'RefDefault|MakeFromName|MakeDefault|addRect\(|detach\(|Make\(|constexpr SkSpan' |
              Select-Object -First 20 |
              ForEach-Object { $_.Line.Trim() }
          }

      - name: Configure (CMake + VS2022, Skia ON)
        shell: pwsh
        run: |
          $tc = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build-skia -G "Visual Studio 17 2022" -A x64 `
            -DAIRUI_WITH_SKIA=ON "-DCMAKE_TOOLCHAIN_FILE=$tc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Full build, not just the Skia targets: app, gallery, every test,
      # static libs and the plugin DLL are all produced and published.
      - name: Build ALL targets (app, gallery, tests, Skia plugin DLL)
        shell: pwsh
        run: |
          cmake --build build-skia --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run G5 dual-backend parity test
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          & .\build-skia\Release\test_skia_backend.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run runtime Skia plugin selection test
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          & .\build-skia\Release\test_skia_plugin.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full ctest suite (Skia ON)
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build-skia -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Publish EVERYTHING this build produced: all app/test exes, all
      # static libs, the plugin DLL and the full vcpkg runtime DLL set.
      # The bundle is directly deployable next to an x64 exe (including
      # the VS2017 official build, which has no Skia SDK).
      - name: Stage FULL Skia build artifacts
        shell: pwsh
        run: |
          $dst = "artifact-staging"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem "build-skia\Release" -File |
            Where-Object { $_.Extension -in @(".exe", ".dll", ".lib") } |
            ForEach-Object { Copy-Item $_.FullName $dst -Force }
          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path $bin) {
            Get-ChildItem -Path $bin -Filter "*.dll" -File | ForEach-Object {
              Copy-Item $_.FullName $dst -Force
            }
          } else {
            Write-Host "No vcpkg bin directory; plugin is self-contained."
          }
          $readme = @(
            "Complete p-system build with Skia ON (VS2022 x64 + vcpkg skia).",
            "Built by the GitHub Actions skia-windows job.",
            "",
            "Contents: ALL exe/dll/lib from build-skia/Release, plus the",
            "full vcpkg runtime DLL set required by airui-skia.dll.",
            "",
            "Usage on Windows (x64):",
            "  1. Copy ALL files in this bundle next to your application exe.",
            "  2. Run: airecord.exe --core-shell --paint-backend=skia",
            "     --core-shell is REQUIRED: the backend registry is only",
            "     used by the ShellCore/HAL chrome path (default off).",
            "     or set AIRUI_PAINT_BACKEND=skia.",
            "  3. Without the DLL the app silently falls back to GDI;",
            "     check the [paint] line in client.log for the active backend.",
            "",
            "test_skia_plugin.exe / test_skia_backend.exe are console tests",
            "built with the same toolchain as the plugin.",
            "test_paint_compare.exe prints a per-primitive GDI vs Skia",
            "pixel diff when the plugin DLL is available."
          ) -join "`r`n"
          Set-Content -Path "$dst\README.txt" -Value $readme -Encoding ascii
          Get-ChildItem $dst | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload full Skia build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airui-skia-windows-x64
          path: artifact-staging/
          if-no-files-found: error
          retention-days: 14
